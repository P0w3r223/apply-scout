name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # pyproject declares >=3.11, so both ends of that claim are tested.
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        # The whole agent loop is exercised against a scripted fake model
        # (tests/fakes.py) — no network and no ANTHROPIC_API_KEY are needed,
        # so a failure here is a real change in behaviour, not a flaky call.
        run: pytest

      - name: Re-measure the attack surface
        # The security claims in the README are numbers, and this regenerates them from the
        # production toolset — no key, no network, no cassette, so it runs beside the tests
        # rather than beside the replay. Two outputs on purpose: the diffed file states what the
        # guards permitted, which is the same on every machine, while the run prints how much of
        # each page this runner's trafilatura let through, which is not. Approving that second
        # half would turn somebody's dependency bump into a red build — this repository has
        # already been bitten once by trafilatura extracting differently on a newer runner.
        run: |
          python -m apply_scout.attack --out "$RUNNER_TEMP/attack.md"
          diff -u eval/expected/attack.md "$RUNNER_TEMP/attack.md"

  replay:
    # Re-runs the real evaluation from the committed cassette: the same postings,
    # the same model responses, no network and no API key. This is what makes the
    # published numbers reproducible by anyone rather than taken on trust.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Replay the evaluation from the cassette
        # Until the first cassette is recorded there is nothing to replay; say so
        # out loud rather than passing a job that silently did nothing.
        run: |
          if [ -f eval/cassettes/eval.jsonl ]; then
            apply-scout eval --tasks eval/tasks.json \
              --models claude-haiku-4-5,claude-opus-4-8 \
              --cassette-mode replay --out eval/results/replay.md
            cat eval/results/replay.md
            # Replaying without checking only proves the cassette still resolves. The
            # published table is a claim about numbers, so diff them: a change in metric
            # semantics regenerates a different table and must not pass green.
            diff -u eval/expected/pipeline.md eval/results/replay.md
          else
            echo "No cassette committed yet — record one with --cassette-mode record."
          fi
      - name: Replay the agent-loop row of the comparison
        # The loop-vs-pipeline claim is the project's headline result, so it is replayed
        # from the same cassette as the pipeline rows rather than taken on trust.
        run: |
          if [ -f eval/cassettes/eval.jsonl ]; then
            apply-scout eval --tasks eval/tasks.json --models claude-haiku-4-5 \
              --runner agent --cassette-mode replay --out eval/results/replay-agent.md
            cat eval/results/replay-agent.md
            diff -u eval/expected/agent.md eval/results/replay-agent.md
          fi
      - name: Replay the recorded demo run
        # The README's demo claims a specific stream of steps. Replay the run behind it and
        # fail if a single printed line has moved: the picture must stay an artifact of a
        # reproducible run, not a screenshot nobody can check.
        run: |
          if [ -f eval/cassettes/run.jsonl ]; then
            python scripts/demo.py capture \
              --url https://jobs.lever.co/tryjeeves/2f00206f-6091-4eed-8b5f-1325afdbfe30 \
              --cv cv/candidate.md --github-user P0w3r223 \
              --cassette-mode replay --cast "$RUNNER_TEMP/replay-cast.json" \
              --expect docs/demo-cast.json
          else
            echo "No demo cassette committed yet."
          fi
