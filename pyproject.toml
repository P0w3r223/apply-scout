[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apply-scout"
version = "0.1.0"
description = "An LLM agent that matches a job posting against a candidate's CV and GitHub evidence — a from-scratch tool loop with safety budgets and a trajectory-evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llm-agent", "function-calling", "tool-use", "agent-evaluation", "anthropic"]
dependencies = [
    # The agent talks to Claude via the official SDK. The tool loop is written
    # from scratch (see docs/decisions/0001) — the SDK is used only as the model
    # transport, never as an agent framework.
    "anthropic>=0.40",
    "pydantic>=2.7",
    # Fetching + main-content extraction for the fetch_job_posting tool.
    "httpx>=0.27",
    "trafilatura>=1.8",
    # A polished terminal UI for the CLI (step stream + evaluation tables).
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6",
    # Renders docs/demo.gif from the same cast as the SVG. A documentation tool, not part
    # of the agent — nothing under src/ imports it, and `capture` and `render` run without it.
    "pillow>=10",
]

[project.scripts]
apply-scout = "apply_scout.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["apply_scout", "apply_scout.tools"]

[tool.pytest.ini_options]
# "scripts" so the demo renderer (not part of the shipped package) is testable too.
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
